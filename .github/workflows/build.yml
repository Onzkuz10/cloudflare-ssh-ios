name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── 1. Go unit tests (Linux, fast) ────────────────────────────────────────
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum
      - run: go test ./cftunnel/...
        working-directory: go

  # ── 2. gomobile → iOS xcframework (macOS required for Xcode SDKs) ─────────
  build-ios-framework:
    name: Build iOS framework
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Install gomobile + gobind
        working-directory: go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240213143359-d1f7d3436075
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240213143359-d1f7d3436075

      - name: Build xcframework
        working-directory: go
        run: gomobile bind -v -target ios -o ../app/ios/CFTunnelPod/CFTunnel.xcframework ./cftunnel/

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v5
        with:
          name: CFTunnel.xcframework
          path: app/ios/CFTunnelPod/CFTunnel.xcframework
          retention-days: 7

  # ── 3. JS type-check ──────────────────────────────────────────────────────
  js-check:
    name: JS typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app

  # ── 4. Unsigned .ipa for sideloading (AltStore / Sideloadly re-sign it) ───
  build-ipa:
    name: Build unsigned .ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: app

      - name: Build CFTunnel.xcframework
        working-directory: go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240213143359-d1f7d3436075
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240213143359-d1f7d3436075
          gomobile init
          gomobile bind -target ios -o ../app/ios/CFTunnelPod/CFTunnel.xcframework ./cftunnel/

      - name: Install JS deps
        working-directory: app
        run: npm ci

      - name: Install pods
        working-directory: app/ios
        run: bundle exec pod install

      - name: Build Release (unsigned)
        working-directory: app/ios
        run: |
          set -o pipefail
          xcodebuild build             -workspace CloudflareSSH.xcworkspace             -scheme CloudflareSSH             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             | tail -n 40

      - name: Package .ipa
        run: |
          APP=$(find app/ios/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CloudflareSSH-unsigned.ipa Payload
          ls -lh CloudflareSSH-unsigned.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: CloudflareSSH-unsigned.ipa
          path: CloudflareSSH-unsigned.ipa
          retention-days: 14
