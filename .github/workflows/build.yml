name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Go unit tests (Linux, fast) ────────────────────────────────────────
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum
      - run: go test ./...
        working-directory: go

  # ── 2. gomobile → iOS xcframework (macOS required for Xcode SDKs) ─────────
  build-ios-framework:
    name: Build iOS framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
        working-directory: go

      - name: Build xcframework
        run: gomobile bind -target ios -o ../CFTunnel.xcframework ./cftunnel/
        working-directory: go

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFTunnel.xcframework
          path: CFTunnel.xcframework
          retention-days: 7

  # ── 3. JS type-check + lint ───────────────────────────────────────────────
  js-check:
    name: JS typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
