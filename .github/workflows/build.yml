name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── 1. Go unit tests (Linux, fast) ────────────────────────────────────────
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum
      - run: go test ./cftunnel/...
        working-directory: go

  # ── 2. gomobile → iOS xcframework (macOS required for Xcode SDKs) ─────────
  build-ios-framework:
    name: Build iOS framework
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Install gomobile + gobind
        working-directory: go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240213143359-d1f7d3436075
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240213143359-d1f7d3436075

      - name: Build xcframework
        working-directory: go
        run: gomobile bind -v -target ios -o ../CFTunnel.xcframework ./cftunnel/

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v5
        with:
          name: CFTunnel.xcframework
          path: CFTunnel.xcframework
          retention-days: 7

  # ── 3. JS type-check ──────────────────────────────────────────────────────
  js-check:
    name: JS typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
