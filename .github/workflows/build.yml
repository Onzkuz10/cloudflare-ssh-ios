name: Build

on:
  push:
    branches: [main]
  pull_request:

env:
  MOBILE_VERSION: v0.0.0-20231127183840-76ac6878050a

jobs:
  # ── 1. Go unit tests (Linux, fast) ────────────────────────────────────────
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - run: go test ./cftunnel/...
        working-directory: go

  # ── 2. gomobile → iOS xcframework (macOS required for Xcode SDKs) ─────────
  build-ios-framework:
    name: Build iOS framework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          # Allow toolchain downloads so gomobile can find its deps
          check-latest: false

      - name: Install gomobile + gobind
        working-directory: go
        env:
          GOFLAGS: ""
          GOTOOLCHAIN: go1.22.12
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.MOBILE_VERSION }}
          go install golang.org/x/mobile/cmd/gobind@${{ env.MOBILE_VERSION }}
          gomobile init

      - name: Build xcframework
        working-directory: go
        run: gomobile bind -v -target ios -o ../CFTunnel.xcframework ./cftunnel/

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v5
        with:
          name: CFTunnel.xcframework
          path: CFTunnel.xcframework
          retention-days: 7

  # ── 3. JS type-check ──────────────────────────────────────────────────────
  js-check:
    name: JS typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
